<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UV 제품 허브 — 운영진용</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1526'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='14' font-weight='bold' fill='%237b93ff' text-anchor='middle'%3EUV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="uv.css">
<style>
/* ★운영진용 화면. 수강생에게 보내는 페이지가 아니라 **링크를 골라 복사하는 도구**다.
   공통 스타일은 uv.css 를 쓰고, 여기 필요한 것만 더한다
   (uv.css 는 지금 다른 작업이 만지는 중이라 건드리지 않는다). */
main{max-width:1040px}
.tag{max-width:640px}

/* 기수 줄 — 고른 기수와 개수를 크게 */
.picked{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  margin:34px 0 14px;padding-bottom:14px;border-bottom:1px solid #26314f;
}
.picked h2{
  font-family:"Nanum Myeongjo",serif;font-size:1.5rem;margin:0;color:#fff;font-weight:800;
}
.picked .count{color:#8b96b4;font-size:.86rem}
.picked .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* 프로그램 한 줄 — 카드보다 촘촘하게. 훑고 복사하는 화면이다. */
.rows{display:grid;gap:10px}
.row{
  display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;
  border:1px solid #26314f;border-radius:12px;padding:15px 18px;
  background:linear-gradient(180deg,rgba(21,29,50,.92),rgba(15,21,38,.92));
}
.row .name{font-weight:700;color:#fff;font-size:1.02rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .name .ed{
  font-size:.76rem;font-weight:700;color:#b9c6ee;background:rgba(123,147,255,.16);
  border:1px solid #3d4a76;border-radius:999px;padding:2px 11px;
}
.row .sub{color:#8b96b4;font-size:.82rem;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.row .sub .warn{color:#d9a94e}
.row .link{
  margin-top:8px;font-family:Consolas,"D2Coding",monospace;font-size:.76rem;
  color:#6f7994;word-break:break-all;
}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.btn{
  appearance:none;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;
  border:1px solid #3a4668;border-radius:8px;padding:7px 13px;
  color:#c3cbe2;background:rgba(123,147,255,.08);white-space:nowrap;
}
.btn:hover{border-color:#5b76f7;color:#fff;background:rgba(91,118,247,.22)}
.btn:focus-visible{outline:2px solid #7b93ff;outline-offset:2px}
.btn.primary{border-color:#5b76f7;background:rgba(91,118,247,.28);color:#fff}
.btn.done{border-color:#3f8f6a;background:rgba(79,190,139,.2);color:#9fe0c0}
.btn[disabled]{opacity:.4;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-block}

/* 전체 배포표 — 기수 × 프로그램 */
.matrix{overflow-x:auto;margin-top:14px}
.matrix table{width:100%;border-collapse:collapse;font-size:.82rem}
.matrix th{
  text-align:left;font-weight:700;color:#8b96b4;padding:8px 10px;
  border-bottom:1.5px solid #3a4668;white-space:nowrap;font-size:.76rem;
}
.matrix th.p{text-align:center}
.matrix td{padding:9px 10px;border-bottom:1px solid #222c47;color:#c3cbe2;white-space:nowrap}
.matrix td.p{text-align:center;color:#3a4668}
.matrix td.on{color:#7b93ff;font-weight:700}
.matrix tr:hover td{background:rgba(123,147,255,.05)}
.matrix .none{color:#6f7994}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:#1b2540;border:1px solid #3f8f6a;color:#9fe0c0;
  padding:11px 22px;border-radius:10px;font-size:.86rem;font-weight:700;
  box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:760px){
  .row{grid-template-columns:1fr}
  .row .btns{justify-content:flex-start}
}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="uv">UV</span><small>RAION PRODUCT HUB · 운영진용</small></div>
  <p class="tag">수강생에게 보낼 프로그램 링크를 기수별로 모아 둔 곳입니다.
    기수를 고르고 <b>복사</b>해서 전달하세요.</p>

  <p class="section">기수</p>
  <ul class="courses" id="courses"></ul>

  <div class="picked">
    <h2 id="pickname">—</h2>
    <span class="count" id="pickcount"></span>
    <span class="act">
      <button class="btn primary" id="copyall" type="button">이 기수 안내문 통째로 복사</button>
      <button class="btn" id="copylinks" type="button">링크만 복사</button>
    </span>
  </div>

  <div class="rows" id="rows"></div>
  <p class="empty" id="empty" hidden></p>

  <p class="section" style="margin-top:48px">전체 배포표</p>
  <p class="tag" style="margin-bottom:0;font-size:.86rem">어느 기수가 무엇을 받는지 한눈에 봅니다.
    기수 이름을 누르면 위에서 그 기수가 열립니다.</p>
  <div class="matrix" id="matrix"></div>

  <footer>© RAION · 이 페이지는 운영진용입니다 ·
    <a href="https://github.com/raion-log">github.com/raion-log</a></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 기수·프로그램 데이터는 embed.js 가 불러온다. 새 프로그램이 생기면
     products/ 에 파일을 만들고 embed.js 의 목록에만 한 줄 더하면 된다. -->
<script src="embed.js"></script>
<script>
UV.ready.then(({ courses, items }) => {
  const $ = (id) => document.getElementById(id);
  const rows = $('rows'), bar = $('courses'), empty = $('empty');
  const esc = (s) => String(s == null ? '' : s);

  // 전달할 주소 — 랜딩이 있으면 랜딩, 없으면 설치파일, 그것도 없으면 버전 목록.
  const 주소 = (p) => p.site || p.download || p.releases || '';
  const 상태 = (p) => p.site ? '랜딩 있음' : p.download ? '설치파일 직링크' : '설치파일 없음 (준비 중)';
  const 안됨 = (p) => !p.site && !p.download;
  // 안내문에 넣을 가이드 링크 — notes 안의 <a href> 를 그대로 쓴다.
  const 가이드 = (p) => {
    const m = (p.notes || []).join(' ').match(/href="([^"]+)"/);
    return m ? m[1] : '';
  };

  let 지금 = '';

  const 알림 = (말) => {
    const t = $('toast');
    t.textContent = 말;
    t.classList.add('show');
    clearTimeout(알림._t);
    알림._t = setTimeout(() => t.classList.remove('show'), 1600);
  };

  // ★file:// 나 옛 브라우저에서는 navigator.clipboard 가 없다. 그때도 되게 둔다.
  const 복사 = async (글, 말) => {
    try {
      await navigator.clipboard.writeText(글);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = 글;
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.append(ta);
      ta.select();
      try { document.execCommand('copy'); } catch { /* 그래도 안 되면 알림만 */ }
      ta.remove();
    }
    알림(말 || '복사했습니다');
  };

  // ★「전체」는 기수와 무관하게 우리 프로그램을 통째로 본다 — 운영진이
  //   「지금 뭐가 다 있지」를 확인하는 자리다.
  const ALL = '전체';
  const 그기수 = (기수) =>
    (기수 === ALL ? items : items.filter((p) => (p.courses || []).includes(기수)));

  const 안내문 = (기수) => {
    const 줄 = [기수 === ALL ? '[전체 프로그램]' : `[${기수}] 프로그램 안내`, ''];
    그기수(기수).forEach((p) => {
      const 이름 = p.name + (p.edition ? ` (${p.edition})` : '');
      줄.push(`■ ${이름}${p.version ? ' v' + p.version : ''}`
        + (p.kind === 'ext' ? ' — 크롬 확장' : ''));
      줄.push(`   ${주소(p)}`);
      const g = 가이드(p);
      if (g) 줄.push(`   설치 가이드: ${g}`);
      줄.push('');
    });
    return 줄.join('\n').trim();
  };

  const 그리기 = (기수) => {
    지금 = 기수;
    const 목록 = 그기수(기수);
    $('pickname').textContent = 기수 === ALL ? '전체 프로그램' : 기수;
    $('pickcount').textContent = 목록.length
      ? (기수 === ALL ? `${목록.length}개` : `프로그램 ${목록.length}개`) : '';
    $('copyall').disabled = !목록.length;
    $('copylinks').disabled = !목록.length;
    empty.hidden = !!목록.length;
    empty.textContent = `「${기수}」에 배포되는 프로그램이 아직 없습니다.`;

    rows.innerHTML = '';
    목록.forEach((p) => {
      const el = document.createElement('div');
      el.className = 'row';
      const g = 가이드(p);
      el.innerHTML = `
        <div>
          <div class="name">${esc(p.name)}
            ${p.edition ? `<span class="ed">${esc(p.edition)}</span>` : ''}</div>
          <div class="sub">
            ${p.version ? `<span>v${esc(p.version)}</span>` : ''}
            <span>${p.kind === 'ext' ? '크롬 확장' : p.kind === 'win' ? 'Windows 앱' : ''}</span>
            <span class="${안됨(p) ? 'warn' : ''}">${상태(p)}</span>
            ${p.published ? `<span>${esc(p.published)}</span>` : ''}
          </div>
          <div class="sub" style="margin-top:2px">
            <span>${(p.courses || []).length
              ? esc((p.courses || []).join(' · ')) : '배포 기수 미정'}</span>
          </div>
          <div class="link">${esc(주소(p))}</div>
        </div>
        <div class="btns">
          <button class="btn primary" data-copy="${esc(주소(p))}">링크 복사</button>
          ${g ? `<button class="btn" data-copy="${esc(g)}" data-what="가이드 링크">가이드</button>` : ''}
          <a class="btn" href="${esc(주소(p))}" target="_blank" rel="noopener">열기</a>
        </div>`;
      rows.append(el);
    });

    bar.querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.name === 기수));
    });
    try { localStorage.setItem('uv-course', 기수); } catch { /* 사생활 보호 창이면 넘어간다 */ }
  };

  // 링크 복사 (행 안의 단추는 위임으로 받는다)
  rows.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-copy]');
    if (!b) return;
    복사(b.dataset.copy, (b.dataset.what || '링크') + ' 복사했습니다');
    b.classList.add('done');
    setTimeout(() => b.classList.remove('done'), 1200);
  });

  $('copyall').addEventListener('click', () => 복사(안내문(지금), '안내문을 복사했습니다'));
  $('copylinks').addEventListener('click',
    () => 복사(그기수(지금).map((p) => 주소(p)).join('\n'), '링크를 복사했습니다'));

  // ── 기수 단추
  [ALL, ...courses].forEach((name) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = name;
    btn.dataset.name = name;
    btn.setAttribute('aria-pressed', 'false');
    btn.addEventListener('click', () => 그리기(name));
    li.append(btn);
    bar.append(li);
  });

  // ── 전체 배포표
  const m = document.createElement('table');
  const 머리 = items.map((p) =>
    `<th class="p">${esc(p.name.replace('RAION ', '').replace(' 자동배치', ''))}`
    + `${p.edition ? `<br><span style="font-weight:400;opacity:.7">${esc(p.edition.split(' · ')[0])}</span>` : ''}</th>`
  ).join('');
  m.innerHTML = `<tr><th>기수</th>${머리}<th class="p">개수</th></tr>`
    + courses.map((c) => {
        const 칸 = items.map((p) =>
          (p.courses || []).includes(c)
            ? '<td class="p on">●</td>' : '<td class="p">·</td>').join('');
        const n = 그기수(c).length;
        return `<tr><td><button class="btn" data-go="${esc(c)}"`
          + ` style="padding:3px 10px;font-size:.78rem">${esc(c)}</button></td>`
          + `${칸}<td class="p ${n ? '' : 'none'}">${n || '—'}</td></tr>`;
      }).join('');
  $('matrix').append(m);
  m.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-go]');
    if (!b) return;
    그리기(b.dataset.go);
    document.querySelector('.picked').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // 지난번에 보던 기수를 기억한다. 없으면 맨 끝(가장 최근).
  let 처음 = ALL;
  try {
    const saved = localStorage.getItem('uv-course');
    if (saved && (saved === ALL || courses.includes(saved))) 처음 = saved;
  } catch { /* 못 읽으면 전체 */ }
  그리기(처음);
}).catch((e) => {
  document.getElementById('empty').hidden = false;
  document.getElementById('empty').textContent =
    '프로그램 목록을 불러오지 못했습니다. 새로고침해 보세요.';
  console.error(e);
});
</script>
</body>
</html>
