<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UV — RAION 제품 허브</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1526'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='14' font-weight='bold' fill='%237b93ff' text-anchor='middle'%3EUV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="uv.css">
</head>
<body>
<main>
  <div class="brand"><span class="uv">UV</span><small>RAION PRODUCT HUB</small></div>
  <p class="tag">RAION 프로그램은 이 한 페이지에서 받습니다.
    듣고 계신 강의를 고르면 그 기수에 배포되는 프로그램만 보입니다.</p>

  <p class="section">강의</p>
  <ul class="courses" id="courses"></ul>

  <p class="section" id="listhead">프로그램</p>
  <div class="blocks" id="blocks"></div>
  <p class="empty" id="empty" hidden></p>

  <div class="soon">받으실 프로그램이 안 보이거나 로그인이 안 되면 담당자에게 알려 주세요.</div>

  <footer>© RAION · <a href="https://github.com/raion-log">github.com/raion-log</a></footer>
</main>

<!-- 기수·프로그램 데이터는 embed.js 가 불러온다. 새 프로그램이 생기면
     products/ 에 파일을 만들고 **embed.js 의 목록에만** 한 줄 더하면 된다.
     수강생 페이지 같은 다른 사이트도 이 파일 한 줄로 같은 데이터를 쓴다. -->
<script src="embed.js"></script>
<script>
UV.ready.then(({ courses, items }) => {
  const ALL = '전체';
  const blocks = document.getElementById('blocks');
  const bar = document.getElementById('courses');
  const empty = document.getElementById('empty');

  const esc = (s) => String(s == null ? '' : s);
  const 있으면 = (v, fn) => (v ? fn(v) : '');

  // ── 사양 접이식. spec 이 없는 프로그램은 통째로 안 그린다.
  const 사양 = (s) => {
    if (!s) return '';
    const rows = (s.rows || []).map(([항목, 최소, 권장, 결과, 아픔]) => `
      <tr><td class="item">${esc(항목)}</td><td>${esc(최소)}</td>
          <td class="rec">${esc(권장)}</td>
          <td class="${아픔 ? 'hit' : ''}">${esc(결과)}</td></tr>`).join('');
    const 목록 = (arr, 표) => (arr || []).map(([본, 밑]) => `
      <li><i>${표}</i><div>${본}${밑 ? `<small>${밑}</small>` : ''}</div></li>`).join('');
    const ways = (s.ways || []).map(([k, v]) =>
      `<div class="way"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
    return `
      <details class="spec">
        <summary>내 PC로 되나요 — 최소 · 권장 사양 보기</summary>
        <div class="specbody">
          ${있으면(s.head, (h) => `<p class="small">${h}</p>`)}
          <div class="tablewrap">
            <table>
              <tr><th>항목</th><th>최소</th><th class="rec">권장</th><th>최소 사양이면</th></tr>
              ${rows}
            </table>
          </div>
          ${있으면(s.note, (n) => `<p class="small" style="margin-top:14px">${n}</p>`)}
          <div class="split">
            <div class="col yes"><h4>그대로 됩니다</h4><ul>${목록(s.yes, '✓')}</ul></div>
            <div class="col no"><h4>안 됩니다</h4><ul>${목록(s.no, '✕')}</ul></div>
          </div>
          ${ways ? `<div class="gate">
            <h4>자막 없는 영상을 쓰려면 — 둘 중 하나만 있으면 됩니다</h4>
            <div class="ways">${ways}</div></div>` : ''}
          ${있으면(s.tail, (t) => `<p class="small" style="margin-top:18px">${t}</p>`)}
        </div>
      </details>`;
  };

  // 크롬 확장은 설치가 앱과 다르다 — 압축을 풀고 개발자 모드로 얹는다.
  const 확장설치 = () => `
    <details class="spec">
      <summary>크롬에 얹는 법 — 처음 한 번만</summary>
      <div class="specbody">
        <ol class="steps">
          <li>받은 <b>zip 파일의 압축을 풉니다.</b> 푼 폴더는 지우지 마세요 —
            크롬이 그 폴더를 계속 읽습니다.</li>
          <li>크롬 주소창에 <b>chrome://extensions</b> 를 입력합니다.</li>
          <li>오른쪽 위 <b>개발자 모드</b>를 켭니다.</li>
          <li>왼쪽 위 <b>「압축해제된 확장 프로그램을 로드합니다」</b>를 누르고
            방금 푼 폴더를 고릅니다.</li>
        </ol>
        <p class="small" style="margin-top:14px">새 판이 나오면 같은 자리에 다시 풀고
          <b>chrome://extensions 에서 새로고침</b>을 누르면 됩니다.</p>
      </div>
    </details>`;

  const 카드 = (p) => {
    const 기수 = (p.courses || []).length
      ? (p.courses || []).map((c) => `<li class="course">${esc(c)}</li>`).join('')
      : '<li class="wait">배포 기수 미정</li>';
    const 배지 = (p.badges || []).map((b) => `<li>${esc(b)}</li>`).join('');
    const 판 = p.version ? `<li>${esc(p.version)}</li>` : '';
    const 종류 = p.kind === 'ext' ? '<li class="kind">크롬 확장</li>'
      : p.kind === 'win' ? '<li class="kind">Windows 앱</li>' : '';
    const 받는말 = p.kind === 'ext' ? '확장프로그램 내려받기' : '설치기 다운로드';
    const 받기 = p.download
      ? `<a class="dl" href="${esc(p.download)}">${esc(p.version)} ${받는말}</a>`
        + (p.releases ? `<a class="alt" href="${esc(p.releases)}">전체 버전 목록</a>` : '')
      : (p.releases ? `<a class="dl" href="${esc(p.releases)}">전체 버전 목록에서 받기</a>` : '');
    const 자산 = p.file ? `
      <div class="specmeta">
        <div><span class="k">파일</span><code>${esc(p.file)}</code></div>
        ${있으면(p.size, (v) => `<div><span class="k">크기</span><span>${esc(v)}</span></div>`)}
        ${있으면(p.published, (v) => `<div><span class="k">게시일</span><span>${esc(v)}</span></div>`)}
        ${있으면(p.sha256, (v) => `<div><span class="k">SHA-256</span><code>${esc(v)}</code></div>`)}
      </div>` : '';
    const 안내 = (p.notes || []).length
      ? `<p class="fine">${(p.notes || []).join('<br>')}</p>` : '';

    const el = document.createElement('div');
    el.className = 'card block' + (p.download ? '' : ' pending');
    el.dataset.courses = JSON.stringify(p.courses || []);
    el.innerHTML = `
      <h2>${esc(p.name)}${p.edition ? `<span class="edition">${esc(p.edition)}</span>` : ''}</h2>
      <p class="en">${esc(p.en)}</p>
      <p>${esc(p.desc)}</p>
      <ul class="meta">${기수}${종류}${판}${배지}</ul>
      ${받기}
      ${자산}
      ${안내}
      ${p.kind === 'ext' ? 확장설치() : ''}
      ${사양(p.spec)}`;
    return el;
  };

  items.forEach((p) => blocks.append(카드(p)));

  // ── 기수 고르기 ─────────────────────────────────
  const cards = [...blocks.children];
  const show = (pick) => {
    let seen = 0;
    cards.forEach((c, i) => {
      const 것 = JSON.parse(c.dataset.courses || '[]');
      const on = pick === ALL || 것.includes(pick);
      c.hidden = !on;
      if (on) seen += 1;
    });
    empty.hidden = seen > 0;
    empty.textContent = pick === ALL
      ? '아직 올라온 프로그램이 없습니다.'
      : `「${pick}」에 배포되는 프로그램이 아직 없습니다.`;
    bar.querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.name === pick));
    });
    try { localStorage.setItem('uv-course', pick); } catch { /* 사생활 보호 창이면 넘어간다 */ }
  };

  [ALL, ...courses].forEach((name) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = name;
    btn.dataset.name = name;
    btn.setAttribute('aria-pressed', 'false');
    btn.addEventListener('click', () => show(name));
    li.append(btn);
    bar.append(li);
  });

  let 처음 = ALL;
  try {
    const saved = localStorage.getItem('uv-course');
    if (saved && (saved === ALL || courses.includes(saved))) 처음 = saved;
  } catch { /* 못 읽으면 전체 */ }
  show(처음);
}).catch((e) => {
  // 데이터를 못 불러오면 빈 화면 대신 이유를 말한다.
  document.getElementById('empty').hidden = false;
  document.getElementById('empty').textContent =
    '프로그램 목록을 불러오지 못했습니다. 새로고침해 보시고, 그래도 안 되면 담당자에게 알려 주세요.';
  console.error(e);
});
</script>
</body>
</html>
